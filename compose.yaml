services:
  app:
    build: .
    image: ghcr.io/ibbylabs/watchbridge:latest
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      APP_URL: http://localhost:8080
      DATABASE_URL: postgres://watchbridge:watchbridge@postgres:5432/watchbridge
      REDIS_URL: redis://redis:6379
      # Provide these via a .env file or your secret manager:
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-cloudflare}
      # Transactional email via Resend. Optional: without a key, every message
      # (including the account-verification link) is logged instead of sent.
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: Watchbridge <no-reply@localhost>
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: watchbridge
      POSTGRES_PASSWORD: watchbridge
      POSTGRES_DB: watchbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U watchbridge']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
